<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>オフライン - マイアプリ</title>
    <!-- 電波がないときに出す画面。外部のファイルは読めないので、見た目はこのファイルの中だけで作る -->
    <style>
        :root {
            --color-primary: #2563eb;
            --color-bg: #eff6ff;
            --color-text: #0f172a;
            --color-muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        }
        h1 { margin: 0; font-size: 20px; }
        p { margin: 0; color: var(--color-muted); line-height: 1.7; }
        button {
            margin-top: 8px;
            padding: 12px 24px;
            border: 0;
            border-radius: 12px;
            background: var(--color-primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- どのページの場所で出しても表示できるよう、アイコンはファイルの中に描く -->
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
        <rect width="72" height="72" rx="16" fill="#2563eb"/>
        <g transform="translate(16 16) scale(1.6667)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
        </g>
    </svg>
    <h1>オフラインです</h1>
    <p>インターネットにつながっていません。<br>電波のある場所で、開き直してください。</p>
    <button type="button" onclick="location.reload()">もう一度読み込む</button>
</body>
</html>
