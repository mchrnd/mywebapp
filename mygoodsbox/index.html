<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>グッズ管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 色はCSS変数（css/style.css）に紐付ける。配色の変更は変数側だけで行う
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        'primary-dark': 'var(--color-primary-dark)',
                        bg: 'var(--color-bg)',
                        surface: 'var(--color-surface)',
                        text: 'var(--color-text)',
                        muted: 'var(--color-muted)',
                        border: 'var(--color-border)',
                        danger: 'var(--color-danger)'
                    }
                }
            }
        };
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body class="bg-bg text-text min-h-screen antialiased">
    <div id="app"></div>
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-[calc(5rem+env(safe-area-inset-bottom))] z-50 pointer-events-none"></div>
    <script type="module" src="js/main.js?v=11"></script>
</body>
</html>
