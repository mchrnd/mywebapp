<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>マイアプリ</title>
    <!-- サイト全体を1つのアプリとしてホーム画面に追加できるようにする（PWA） -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        bg: 'var(--color-bg)',
                        surface: 'var(--color-surface)',
                        text: 'var(--color-text)',
                        muted: 'var(--color-muted)',
                        border: 'var(--color-border)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@1.67.0/dist/umd/lucide.min.js" integrity="sha384-xrRF3kGz5GMZeUudxpTxrrjy0NRy/+U3dHY72SdMEgy9OsrO9x8mCw6DCD8m+jjS" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #2563eb;
            --color-primary-dark: #1d4ed8;
            --color-bg: #eff6ff;
            --color-surface: #ffffff;
            --color-text: #0f172a;
            --color-muted: #64748b;
            --color-border: #bfdbfe;
            --color-danger: #dc2626;
        }
        body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-bg text-text min-h-screen antialiased">
    <header class="bg-primary text-white shadow-md" style="padding-top: env(safe-area-inset-top)">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <h1 class="text-lg sm:text-xl font-bold">マイアプリ</h1>
        </div>
    </header>
    <main class="max-w-3xl mx-auto p-4 grid gap-3 sm:grid-cols-2">
        <a href="myreizokokun/" class="flex items-center gap-3 bg-surface border border-border rounded-xl p-4 shadow-sm active:scale-[0.98] transition">
            <i data-lucide="refrigerator" class="w-8 h-8 text-primary shrink-0"></i>
            <div class="min-w-0">
                <div class="font-bold">スマート冷蔵庫チェッカー</div>
                <div class="text-sm text-muted">食材の賞味期限と在庫を管理</div>
            </div>
        </a>
        <a href="mygoodsbox/" class="flex items-center gap-3 bg-surface border border-border rounded-xl p-4 shadow-sm active:scale-[0.98] transition">
            <i data-lucide="box" class="w-8 h-8 text-primary shrink-0"></i>
            <div class="min-w-0">
                <div class="font-bold">グッズ管理</div>
                <div class="text-sm text-muted">フォルダーとタグでグッズの個数を管理</div>
            </div>
        </a>
    </main>
    <!-- アプリとして追加できる状態のときだけ出す -->
    <div id="install" class="max-w-3xl mx-auto px-4 pb-6" hidden>
        <button type="button" id="install-btn" class="w-full flex items-center justify-center gap-2 border border-primary text-primary bg-surface rounded-xl px-4 py-3 font-medium active:scale-[0.98] transition">
            <i data-lucide="download" class="w-5 h-5"></i>
            アプリとして追加
        </button>
    </div>
    <script>
        lucide.createIcons();

        // 電波がないときに案内の画面を出すための Service Worker（sw.js）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service Worker を登録できません', err));
        }

        // Chrome が「追加できる」と知らせてきたら、ボタンを出す。押すと追加の確認が出る
        let installPrompt = null;
        const installBox = document.getElementById('install');
        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            installPrompt = event;
            installBox.hidden = false;
        });
        document.getElementById('install-btn').addEventListener('click', async () => {
            if (!installPrompt) return;
            installPrompt.prompt();
            await installPrompt.userChoice;
            installPrompt = null;
            installBox.hidden = true;
        });
        window.addEventListener('appinstalled', () => { installBox.hidden = true; });
    </script>
</body>
</html>
